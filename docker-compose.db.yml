# 人情记账本 独立 PostgreSQL 模式 compose 扩展文件（V10.10.28 PG 版本化数据卷）
# 由 run.sh 在 DB_MODE=independent 时按需加载：docker compose -f docker-compose.yml -f docker-compose.db.yml
# 取代旧版运行时生成的 .temp/docker-compose.db-override.yml 动态 override 机制
# 说明：
#   - pg 容器不映射宿主机端口，仅在 gift-docker_net 内部互联（安全模型与萌芽一致）
#   - PG_LOCAL_IMAGE / PG_PASSWORD / PG_DATA_DIR / PG_MAJOR 由 run.sh 检测/生成后经 shell 环境变量插值注入
#   - V10.10.28: 卷名改为 gift_pg_data_${PG_MAJOR:-default}（版本化隔离，防止跨 PG 版本 initdb 冲突）

services:
  pg:
    image: ${PG_LOCAL_IMAGE:-postgres:16-alpine}
    container_name: gift_bookkeeping_pg
    restart: unless-stopped
    environment:
      # V10.10.20: 库名/账号/密码支持自定义（PG_DB/PG_USER/PG_PASSWORD，由 run.sh 经环境变量插值，未指定用默认值）
      # V10.10.24: 默认值与传统版差异化（gift_docker_db / gift_docker_user），实现同服务器数据隔离
      - POSTGRES_DB=${PG_DB:-gift_docker_db}
      - POSTGRES_USER=${PG_USER:-gift_docker_user}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      # V10.10.20: 挂载路径按镜像智能匹配（PG18+/pgvector:pg18 → /var/lib/postgresql；15/16/alpine → /var/lib/postgresql/data）
      # V10.10.28: 卷名改为版本化 gift_pg_data_${PG_MAJOR:-default}，各 PG 版本数据天然隔离
      - gift_pg_data_${PG_MAJOR:-default}:${PG_DATA_DIR:-/var/lib/postgresql/data}

  web:
    depends_on:
      - pg

volumes:
  gift_pg_data_${PG_MAJOR:-default}:
    driver: local
