# Nginx SSL 反向代理配置文件 (适用于宿主机 Nginx)
# 拓扑链路：客户端 -> 宿主机 Nginx (HTTPS 15001端口) -> 宿主机映射端口 127.0.0.1:15000 -> Docker 容器 (web:11443端口)
# 证书路径：/opt/service/gift-bookkeeping-app-docker/ssl/server.crt / server.key

upstream gift_app_backend {
    server 127.0.0.1:15000;          # 宿主机上 Docker 映射的 15000 端口 (对应容器内 11443)
    keepalive 32;
}

# HTTPS 服务端口（宿主机 Nginx 监听 15001 端口）
server {
    listen 15001 ssl;                # 监听 HTTPS
    http2 on;                        # 启用 HTTP/2
    server_name _;

    # SSL 证书配置
    ssl_certificate     /opt/service/gift-bookkeeping-app-docker/ssl/server.crt;
    ssl_certificate_key /opt/service/gift-bookkeeping-app-docker/ssl/server.key;

    # SSL 安全优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 上传文件大小限制
    client_max_body_size 20M;

    # 反向代理
    location / {
        proxy_pass http://gift_app_backend;

        # 协议与端口透传
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host:$server_port;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
