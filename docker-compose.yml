version: '3.8'

services:
  # Flask 后端 Web 服务容器
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gift_bookkeeping_web
    restart: always
    environment:
      - SECRET_KEY=gift-bookkeeping-docker-prod-secret-key
      - SESSION_COOKIE_SECURE=true
    volumes:
      - gift_data:/app/data
    networks:
      - gift_network

  # Nginx SSL 反向代理容器
  nginx:
    image: nginx:alpine
    container_name: gift_bookkeeping_nginx
    restart: always
    ports:
      - "80:80"       # HTTP 重定向端口
      - "1443:1443"   # 自定义 HTTPS 服务端口
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - gift_network

volumes:
  gift_data:
    driver: local

networks:
  gift_network:
    driver: bridge
