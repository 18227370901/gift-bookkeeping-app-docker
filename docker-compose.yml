version: '3.8'

services:
  # Flask 后端 Web 服务容器 (默认使用 SQLite 数据库，数据持久化于 gift_data 卷)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gift_bookkeeping_web
    restart: always
    ports:
      - "15000:11443"   # 将宿主机 15000 端口映射到容器内 11443 端口 (宿主机 Nginx 15001 -> 127.0.0.1:15000)
    environment:
      - SECRET_KEY=gift-bookkeeping-docker-prod-secret-key
      - SESSION_COOKIE_SECURE=true
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      # 如使用外部或独立 PostgreSQL 数据库，可配置 DATABASE_URL 环境变量:
      # - DATABASE_URL=postgresql://gift_user:gift_password@host:5432/gift_db
    volumes:
      - gift_data:/app/data
    networks:
      - gift_network

  # Nginx SSL 反向代理容器 (若宿主机无 Nginx，可解开注释使用此容器)
  # nginx:
  #   image: nginx:alpine
  #   container_name: gift_bookkeeping_nginx
  #   restart: always
  #   ports:
  #     - "15001:15001"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - web
  #   networks:
  #     - gift_network

volumes:
  gift_data:
    driver: local

networks:
  gift_network:
    driver: bridge
