# 人情记账本 Docker Compose 核心编排（对齐 mengya-docker 多数据库模式自适应架构）
# - 数据库服务由 run.sh 按 DB_MODE 通过 -f 参数按需合成（独立 PG: docker-compose.db.yml）
# - 默认网络重命名为固定名 gift-docker_net，所有服务自动入网，永不声明 external 网络

services:
  # Flask 后端 Web 服务容器 (默认使用 SQLite 数据库，数据持久化于 gift_data 卷)
  web:
    # V10.10.16: 支持镜像免构建部署模式
    # APP_IMAGE 非空时优先拉取预构建镜像（服务器零构建）；为空时本地 build
    image: ${APP_IMAGE:-gift-bookkeeping-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gift_bookkeeping_web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-15000}:${PORT:-11443}"   # 将宿主机 HOST_PORT (默认 15000) 映射到容器内 PORT (默认 11443) 端口 (宿主机 Nginx 443 SNI 分流 -> 127.0.0.1:HOST_PORT)
    environment:
      - SECRET_KEY=gift-bookkeeping-docker-prod-secret-key
      - SESSION_COOKIE_SECURE=true
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}  # V10.10.16: Gunicorn worker 数量，默认 1（可调 2/4）
      - DATABASE_URL=${DATABASE_URL:-}  # V10.10.17: 空=SQLite(默认)，非空=PostgreSQL
      # 如使用外部或独立 PostgreSQL 数据库，可配置 DATABASE_URL 环境变量:
      # - DATABASE_URL=postgresql://gift_docker_user:gift_docker_pass@host:5432/gift_docker_db
    volumes:
      - gift_data:/app/data

  # Nginx SSL 反向代理容器 (若宿主机无 Nginx，可解开注释使用此容器)
  # nginx:
  #   image: nginx:alpine
  #   container_name: gift_bookkeeping_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "15001:15001"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - web

volumes:
  gift_data:
    driver: local

networks:
  default:
    # V10.10.20(对齐萌芽): 默认网络重命名为自有固定名，服务自动入网，不复用其他项目网络
    name: gift-docker_net
