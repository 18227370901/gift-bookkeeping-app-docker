# -*- coding: utf-8 -*-
# V10.10.16 Docker 镜像自动构建与分发
# 触发条件：push main / 打 tag v*
# 双 Registry 推送：ghcr.io（默认）+ 阿里云 ACR（需配置 secrets）
# 服务器免构建部署：APP_IMAGE=ghcr.io/<owner>/gift-bookkeeping-web:latest ./run.sh restart

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # 支持手动触发

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GHCR: ${{ github.repository_owner }}/gift-bookkeeping-web

  # 阿里云 ACR 配置（需在仓库 Settings → Secrets 配置以下 3 个密钥后启用）
  # ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  # ACR_NAMESPACE: your-namespace
  # ACR_IMAGE_NAME: gift-bookkeeping-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # ghcr.io 推送权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta（提取 tag）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up QEMU（多架构支持）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Registry 1: ghcr.io（GitHub 内置，零密钥配置）
      # ============================================================
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to ghcr.io
        id: build_ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ============================================================
      # Registry 2: 阿里云 ACR（国内拉取更快，需配置 secrets 启用）
      # 配置方法：仓库 Settings → Secrets and variables → Actions → New repository secret
      #   ACR_REGISTRY  = 你的 ACR 注册地址，如 registry.cn-hangzhou.aliyuncs.com
      #   ACR_USERNAME  = 阿里云 ACR 用户名
      #   ACR_PASSWORD   = 阿里云 ACR 访问密码
      # 配置完成后取消下方注释即可启用
      # ============================================================
      # - name: Login to Aliyun ACR
      #   if: ${{ vars.ACR_REGISTRY != '' }}
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ vars.ACR_REGISTRY }}
      #     username: ${{ secrets.ACR_USERNAME }}
      #     password: ${{ secrets.ACR_PASSWORD }}
      #
      # - name: Build and push to Aliyun ACR
      #   if: ${{ vars.ACR_REGISTRY != '' }}
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     file: ./Dockerfile
      #     platforms: linux/amd64,linux/arm64
      #     push: true
      #     tags: |
      #       ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/gift-bookkeeping-web:latest
      #       ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/gift-bookkeeping-web:${{ steps.meta.outputs.version }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max
      #     provenance: false

      - name: Image Digest
        run: echo "镜像构建完成 digest=${{ steps.build_ghcr.outputs.digest }}"
